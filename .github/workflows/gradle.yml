name: FunnyGuilds CI
on:
  push:
    branches: [ 4.x, 5.x, 6.x ]
  pull_request:
    branches: [ 4.x, 5.x, 6.x ]

permissions:
  pull-requests: write
  issues: write

concurrency:
  # pull_request events use refs/pull/<n>/merge, so this groups runs per PR and
  # cancels superseded runs after rapid pushes. Push runs on release branches are
  # never cancelled: they publish snapshots and must not be interrupted mid-publish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Build with JDK${{ matrix.jdk }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 25 ]
    steps:
      - name: Find comment with artifact link
        uses: peter-evans/find-comment@v3
        if: github.event_name == 'pull_request'
        id: init-find-comment
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
      - name: Create initial comment for artifact link
        uses: peter-evans/create-or-update-comment@v4
        id: create-comment
        continue-on-error: true
        if: |
          github.event_name == 'pull_request' &&
          steps.init-find-comment.outputs.comment-id == ''
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 📦 Dev Build

            ⏳ Tutaj dostępna będzie testowa wersja **FunnyGuilds**, posiadająca zmiany z tego Pull Requesta.
          edit-mode: replace
          
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - uses: burrunan/gradle-cache-action@v3
        name: Build FunnyGuilds
        with:
          job-id: jdk${{ matrix.jdk }}
          # Pushes to release branches also publish snapshots in the same invocation,
          # so the dedicated publish workflow does not have to rebuild everything again.
          arguments: ${{ github.event_name == 'pull_request' && 'build --stacktrace -i' || 'build :plugin:publish --stacktrace -i' }}
          read-only: ${{ github.ref != 'refs/heads/4.x' && github.ref != 'refs/heads/5.x' && github.ref != 'refs/heads/6.x' }}
        env:
          MAVEN_NAME: ${{ github.event_name == 'push' && secrets.MAVEN_NAME || '' }}
          MAVEN_TOKEN: ${{ github.event_name == 'push' && secrets.MAVEN_TOKEN || '' }}
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        id: upload-artifact
        continue-on-error: true
        with:
          name: FunnyGuilds Dev Build
          path: plugin/build/libs/FunnyGuilds*.jar
          retention-days: 30
          overwrite: true
          
      - name: Find comment with artifact link
        uses: peter-evans/find-comment@v3
        if: github.event_name == 'pull_request'
        id: find-comment
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
      - name: Update comment with artifact link
        uses: peter-evans/create-or-update-comment@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            ### 📦 Dev Build
            
            Możesz pobrać testową wersję **FunnyGuilds**, ze zmianami z tego Pull Requesta [tutaj](${{ steps.upload-artifact.outputs.artifact-url }})
            
            **⚠️ Uwaga!** Jest to wersja testowa, nie powinno się jej używać na serwerze produkcyjnym. Może posiadać 
            błędy mogące powodować utratę danych graczy i gildii, konfiguracji pluginu itp.
          edit-mode: replace
          reactions: rocket
